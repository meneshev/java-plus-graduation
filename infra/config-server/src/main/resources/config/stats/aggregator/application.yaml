server:
  port: 0

spring:
  application:
    name: aggregator
  main:
    log-startup-info: false
    banner-mode: off
  kafka:
    properties:
      bootstrap-servers: "localhost:9092"
      key-serializer: "org.apache.kafka.common.serialization.VoidSerializer"
      key-deserializer: "org.apache.kafka.common.serialization.VoidDeserializer"
      consumer:
        auto-commit: false
        timeout-ms: 500
        groups:
          aggregator-user-actions: "aggregator-user-actions-group"
      producer:
        linger-ms: 5
      topics:
        user-actions: "stats.user-actions.v1"
        evens-similarity: "stats.events-similarity.v1"

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org:
      springframework.context: ERROR
      apache.kafka: ERROR
      springframework.cloud.netflix.eureka: INFO